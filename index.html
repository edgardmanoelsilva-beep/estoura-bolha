<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoura Bolha - Relaxe</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
    touch-action: manipulation;
  }

  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: manipulation;
  }

  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    pointer-events: none;
    font-weight: 300;
    letter-spacing: 1px;
  }

  #estouradas {
    font-size: 42px;
    font-weight: 200;
    color: rgba(255, 255, 255, 0.85);
    display: block;
    margin-bottom: 5px;
    transition: transform 0.2s ease;
  }

  #estouradas.pulso {
    transform: scale(1.15);
  }

  #recorde {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 5px;
  }

  #fase {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
    font-weight: 300;
  }

  #fase .titulo {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 4px;
  }

  #fase .numero {
    font-size: 36px;
    font-weight: 200;
    display: block;
    margin: 2px 0;
  }

  #progresso {
    width: 200px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin: 8px auto 0;
    overflow: hidden;
  }

  #barra {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(255, 220, 60, 0.9), rgba(255, 70, 90, 0.9));
    transition: width 0.4s ease;
    border-radius: 2px;
  }

  #instrucao {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    animation: fadeInOut 3s ease-in-out infinite;
    text-align: center;
    padding: 0 20px;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  #modo {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 16px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.05);
    z-index: 10;
    touch-action: manipulation;
  }

  #modo:hover {
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.9);
  }

  #combo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    color: rgba(255, 255, 255, 0.95);
    font-size: 80px;
    font-weight: 200;
    pointer-events: none;
    transition: transform 0.4s, opacity 0.6s;
    opacity: 0;
    text-shadow: 0 0 40px rgba(255, 220, 60, 0.8);
    text-align: center;
  }

  #combo.mostrar {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }

  #overlay.mostrar {
    opacity: 1;
    pointer-events: all;
  }

  #overlay h1 {
    font-size: 56px;
    font-weight: 200;
    margin-bottom: 20px;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
    letter-spacing: 4px;
  }

  #overlay p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  #overlay button {
    margin-top: 40px;
    padding: 15px 40px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.3s;
    font-family: inherit;
    touch-action: manipulation;
  }

  #overlay button:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.05);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <span id="estouradas">0</span>
  bolhas
  <div id="recorde">Recorde: <span id="recordeValor">0</span></div>
</div>

<div id="fase">
  <div class="titulo">FASE</div>
  <span class="numero" id="numeroFase">1</span>
  <div id="progresso"><div id="barra"></div></div>
</div>

<div id="modo">MODO ZEN</div>
<div id="combo"></div>

<div id="overlay">
  <h1 id="overlayTitulo">FASE COMPLETA!</h1>
  <p id="overlayTexto">Próxima fase em breve</p>
  <button id="overlayBotao">Continuar</button>
</div>

<div id="instrucao">Junte 3 bolhas com a MESMA cor e o MESMO número!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const estouradasEl = document.getElementById('estouradas');
const recordeEl = document.getElementById('recordeValor');
const modoEl = document.getElementById('modo');
const instrucaoEl = document.getElementById('instrucao');
const comboEl = document.getElementById('combo');
const numeroFaseEl = document.getElementById('numeroFase');
const barraEl = document.getElementById('barra');
const overlayEl = document.getElementById('overlay');
const overlayTituloEl = document.getElementById('overlayTitulo');
const overlayTextoEl = document.getElementById('overlayTexto');
const overlayBotaoEl = document.getElementById('overlayBotao');

let largura, altura;
let bolhas = [];
let particulas = [];
let estouradas = 0;
let modoZen = false;
let bolhasSelecionadas = [];

let fase = 1;
let combosFeitos = 0;
let combosNecessarios = 3;
let jogoPausado = false;
let velocidadeMultiplicador = 1.0;

const tipos = [
  { cor: 'rgba(255, 70, 90, 0.9)',   numero: 1, nome: 'vermelho-1' },
  { cor: 'rgba(60, 130, 255, 0.9)',  numero: 2, nome: 'azul-2' },
  { cor: 'rgba(70, 220, 120, 0.9)',  numero: 3, nome: 'verde-3' },
  { cor: 'rgba(255, 220, 60, 0.9)',  numero: 4, nome: 'amarelo-4' },
  { cor: 'rgba(180, 100, 255, 0.9)', numero: 5, nome: 'roxo-5' },
];

let recorde = parseInt(localStorage.getItem('recordeBolhas') || '0');
recordeEl.textContent = recorde;

function redimensionar() {
  largura = canvas.width = window.innerWidth;
  altura = canvas.height = window.innerHeight;
}

window.addEventListener('resize', redimensionar);
redimensionar();

function criarBolha() {
  const raio = 35 + Math.random() * 25;
  const tipo = tipos[Math.floor(Math.random() * tipos.length)];
  return {
    id: Math.random().toString(36).substring(2, 9),
    x: Math.random() * (largura - raio * 2) + raio,
    y: altura + raio,
    raio: raio,
    cor: tipo.cor,
    numero: tipo.numero,
    tipoNome: tipo.nome,
    velocidade: (0.4 + Math.random() * 0.5) * velocidadeMultiplicador,
    oscilacao: Math.random() * Math.PI * 2,
    oscilacaoVelocidade: 0.01 + Math.random() * 0.02,
    selecionada: false,
    escala: 1.0
  };
}

function criarParticulas(x, y, cor, quantidade = 15) {
  for (let i = 0; i < quantidade; i++) {
    const angulo = (Math.PI * 2 * i) / quantidade + Math.random() * 0.5;
    const velocidade = 2 + Math.random() * 5;
    particulas.push({
      x: x,
      y: y,
      vx: Math.cos(angulo) * velocidade,
      vy: Math.sin(angulo) * velocidade,
      raio: 2 + Math.random() * 5,
      cor: cor,
      vida: 1.0,
      decaimento: 0.012 + Math.random() * 0.015
    });
  }
}

function mostrarCombo(texto, cor) {
  comboEl.textContent = texto;
  comboEl.style.color = cor || 'rgba(255, 255, 255, 0.95)';
  comboEl.classList.add('mostrar');
  setTimeout(() => {
    comboEl.classList.remove('mostrar');
  }, 700);
}

function atualizarBarraProgresso() {
  const pct = (combosFeitos / combosNecessarios) * 100;
  barraEl.style.width = pct + '%';
}

function desenhar() {
  ctx.fillStyle = 'rgba(15, 20, 40, 0.35)';
  ctx.fillRect(0, 0, largura, altura);

  if (!jogoPausado) {
    for (let i = bolhas.length - 1; i >= 0; i--) {
      const b = bolhas[i];
      b.y -= b.velocidade;
      b.oscilacao += b.oscilacaoVelocidade;
      b.x += Math.sin(b.oscilacao) * 0.5;

      const escalaAlvo = b.selecionada ? 1.15 : 1.0;
      b.escala += (escalaAlvo - b.escala) * 0.15;

      if (b.selecionada) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.raio * b.escala + 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      const grad = ctx.createRadialGradient(
        b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.1,
        b.x, b.y, b.raio * b.escala
      );
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      grad.addColorStop(0.5, b.cor);
      grad.addColorStop(1, b.cor.replace('0.9', '0.5'));

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.raio * b.escala, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fill();

      ctx.save();
      ctx.font = `bold ${b.raio * 0.9}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillText(b.numero, b.x + 2, b.y + 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillText(b.numero, b.x, b.y);
      ctx.restore();

      if (b.y + b.raio < 0) {
        const idxSel = bolhasSelecionadas.indexOf(b);
        if (idxSel > -1) bolhasSelecionadas.splice(idxSel, 1);
        bolhas.splice(i, 1);
      }
    }
  }

  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.vida -= p.decaimento;

    if (p.vida <= 0) {
      particulas.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.raio * p.vida, 0, Math.PI * 2);
    ctx.fillStyle = p.cor.replace('0.9', p.vida.toFixed(2));
    ctx.fill();
  }

  requestAnimationFrame(desenhar);
}

function gerarBolhas() {
  if (jogoPausado) {
    setTimeout(gerarBolhas, 500);
    return;
  }

  const maxBolhas = modoZen ? 8 : 10;
  if (bolhas.length < maxBolhas) {
    bolhas.push(criarBolha());
  }
  setTimeout(gerarBolhas, modoZen ? 1200 : 800);
}

function limparSelecionadas() {
  bolhasSelecionadas.forEach(b => {
    b.selecionada = false;
  });
  bolhasSelecionadas = [];
}

function atualizarContador() {
  estouradasEl.textContent = estouradas;
  estouradasEl.classList.add('pulso');
  setTimeout(() => estouradasEl.classList.remove('pulso'), 200);

  if (estouradas > recorde) {
    recorde = estouradas;
    localStorage.setItem('recordeBolhas', recorde);
    recordeEl.textContent = recorde;
  }
}

function passarDeFase() {
  jogoPausado = true;
  overlayTituloEl.textContent = 'FASE ' + fase + ' COMPLETA!';
  overlayTextoEl.textContent = 'Próxima fase: ' + (combosNecessarios + 2) + ' combos';
  overlayEl.classList.add('mostrar');
}

function proximaFase() {
  fase++;
  combosFeitos = 0;
  combosNecessarios += 2;
  velocidadeMultiplicador += 0.2;

  numeroFaseEl.textContent = fase;
  atualizarBarraProgresso();

  bolhas = [];
  particulas = [];
  bolhasSelecionadas = [];
  jogoPausado = false;

  overlayEl.classList.remove('mostrar');
}

function clicar(x, y) {
  if (jogoPausado) return;

  for (let i = bolhas.length - 1; i >= 0; i--) {
    const b = bolhas[i];
    const dist = Math.hypot(x - b.x, y - b.y);
    if (dist < b.raio) {

      if (modoZen) {
        criarParticulas(b.x, b.y, b.cor);
        bolhas.splice(i, 1);
        estouradas++;
        atualizarContador();
        return;
      }

      if (b.selecionada) {
        b.selecionada = false;
        const idxSel = bolhasSelecionadas.indexOf(b);
        if (idxSel > -1) bolhasSelecionadas.splice(idxSel, 1);
        return;
      }

      if (bolhasSelecionadas.length === 0) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        return;
      }

      const primeira = bolhasSelecionadas[0];

      if (b.tipoNome === primeira.tipoNome) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);

        if (bolhasSelecionadas.length === 3) {
          estouradas += 3;
          combosFeitos++;
          atualizarContador();
          atualizarBarraProgresso();
          mostrarCombo('COMBO! +3', primeira.cor);

          bolhasSelecionadas.forEach(sel => {
            criarParticulas(sel.x, sel.y, sel.cor, 20);
          });

          bolhasSelecionadas.forEach(sel => {
            const idx = bolhas.indexOf(sel);
            if (idx > -1) bolhas.splice(idx, 1);
          });

          bolhasSelecionadas = [];

          if (combosFeitos >= combosNecessarios) {
            setTimeout(passarDeFase, 500);
          }
        }
      } else {
        limparSelecionadas();
        b.selecionada = true;
        bolhasSelecionadas.push(b);
      }
      return;
    }
  }

  limparSelecionadas();
}

// CORREÇÃO: pointerdown resolve duplo toque no celular
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clicar(e.clientX, e.clientY);
});

modoEl.addEventListener('click', () => {
  modoZen = !modoZen;
  modoEl.textContent = modoZen ? 'MODO NORMAL' : 'MODO ZEN';
  document.getElementById('ui').style.opacity = modoZen ? '0.3' : '1';
  document.getElementById('fase').style.opacity = modoZen ? '0.3' : '1';
  instrucaoEl.textContent = modoZen ? 'Modo Zen - estoure qualquer bolha' : 'Junte 3 bolhas com a MESMA cor e o MESMO número!';
  limparSelecionadas();
});

overlayBotaoEl.addEventListener('click', proximaFase);

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    fase = 1;
    combosFeitos = 0;
    combosNecessarios = 3;
    velocidadeMultiplicador = 1.0;
    estouradas = 0;
    bolhas = [];
    particulas = [];
    bolhasSelecionadas = [];
    jogoPausado = false;
    numeroFaseEl.textContent = 1;
    atualizarContador();
    atualizarBarraProgresso();
    overlayEl.classList.remove('mostrar');
  }
});

atualizarBarraProgresso();
gerarBolhas();
desenhar();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoura Bolha - Relaxe</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
    touch-action: manipulation;
  }

  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: manipulation;
  }

  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    pointer-events: none;
    font-weight: 300;
    letter-spacing: 1px;
  }

  #estouradas {
    font-size: 42px;
    font-weight: 200;
    color: rgba(255, 255, 255, 0.85);
    display: block;
    margin-bottom: 5px;
    transition: transform 0.2s ease;
  }

  #estouradas.pulso {
    transform: scale(1.15);
  }

  #recorde {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 5px;
  }

  #fase {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    text-align: center;
    font-weight: 300;
    z-index: 5;
  }

  #fase .titulo {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 4px;
  }

  #fase .numero {
    font-size: 36px;
    font-weight: 200;
    display: block;
    margin: 2px 0;
  }

  #progresso {
    width: 200px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin: 8px auto 0;
    overflow: hidden;
  }

  #barra {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(255, 220, 60, 0.9), rgba(255, 70, 90, 0.9));
    transition: width 0.4s ease;
    border-radius: 2px;
  }

  #instrucao {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    animation: fadeInOut 3s ease-in-out infinite;
    text-align: center;
    padding: 0 20px;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  #controles {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    z-index: 10;
    justify-content: flex-end;
    max-width: 60vw;
  }

  .botao-controle {
    color: rgba(255, 255, 255, 0.5);
    font-size: 16px;
    cursor: pointer;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.05);
    touch-action: manipulation;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 36px;
    white-space: nowrap;
  }

  .botao-controle:hover {
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.9);
  }

  .botao-controle.ativo {
    background: rgba(255, 220, 60, 0.2);
    border-color: rgba(255, 220, 60, 0.6);
    color: rgba(255, 220, 60, 1);
  }

  #modo {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 16px;
  }

  #idioma {
    font-size: 18px;
    padding: 8px 12px;
  }

  #modoEdu {
    font-size: 14px;
    padding: 8px 12px;
  }

  #combo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    color: rgba(255, 255, 255, 0.95);
    font-size: 80px;
    font-weight: 200;
    pointer-events: none;
    transition: transform 0.4s, opacity 0.6s;
    opacity: 0;
    text-shadow: 0 0 40px rgba(255, 220, 60, 0.8);
    text-align: center;
  }

  #combo.mostrar {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }

  #overlay.mostrar {
    opacity: 1;
    pointer-events: all;
  }

  #overlay h1 {
    font-size: 56px;
    font-weight: 200;
    margin-bottom: 20px;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
    letter-spacing: 4px;
  }

  #overlay p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  #overlay button {
    margin-top: 40px;
    padding: 15px 40px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.3s;
    font-family: inherit;
    touch-action: manipulation;
  }

  #overlay button:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.05);
  }

  /* Em telas pequenas, empilha os botões */
  @media (max-width: 700px) {
    #controles {
      max-width: 75vw;
      gap: 6px;
    }

    .botao-controle {
      font-size: 14px;
      padding: 6px 10px;
      min-width: 38px;
      min-height: 32px;
    }

    #modo {
      font-size: 10px;
      padding: 6px 12px;
    }

    #idioma {
      font-size: 16px;
    }

    #modoEdu {
      font-size: 12px;
    }

    #fase .numero {
      font-size: 28px;
    }

    #estouradas {
      font-size: 32px;
    }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <span id="estouradas">0</span>
  bolhas
  <div id="recorde">Recorde: <span id="recordeValor">0</span></div>
</div>

<div id="fase">
  <div class="titulo">FASE</div>
  <span class="numero" id="numeroFase">1</span>
  <div id="progresso"><div id="barra"></div></div>
</div>

<div id="controles">
  <button class="botao-controle ativo" id="botaoSom" title="Ligar/desligar som">🔊</button>
  <button class="botao-controle" id="botaoVoz" title="Ligar/desligar voz">🗣️</button>
  <button class="botao-controle" id="idioma" title="Mudar idioma">🇧🇷</button>
  <button class="botao-controle" id="modoEdu" title="Modo educativo">🎓 OFF</button>
  <button class="botao-controle" id="modo">MODO ZEN</button>
</div>

<div id="combo"></div>

<div id="overlay">
  <h1 id="overlayTitulo">FASE COMPLETA!</h1>
  <p id="overlayTexto">Próxima fase em breve</p>
  <button id="overlayBotao">Continuar</button>
</div>

<div id="instrucao">Junte 3 bolhas com a MESMA cor e o MESMO número!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const estouradasEl = document.getElementById('estouradas');
const recordeEl = document.getElementById('recordeValor');
const modoEl = document.getElementById('modo');
const botaoSomEl = document.getElementById('botaoSom');
const botaoVozEl = document.getElementById('botaoVoz');
const idiomaEl = document.getElementById('idioma');
const modoEduEl = document.getElementById('modoEdu');
const instrucaoEl = document.getElementById('instrucao');
const comboEl = document.getElementById('combo');
const numeroFaseEl = document.getElementById('numeroFase');
const barraEl = document.getElementById('barra');
const overlayEl = document.getElementById('overlay');
const overlayTituloEl = document.getElementById('overlayTitulo');
const overlayTextoEl = document.getElementById('overlayTexto');
const overlayBotaoEl = document.getElementById('overlayBotao');

let largura, altura;
let bolhas = [];
let particulas = [];
let estouradas = 0;
let modoZen = false;
let bolhasSelecionadas = [];

let fase = 1;
let combosFeitos = 0;
let combosNecessarios = 3;
let jogoPausado = false;
let velocidadeMultiplicador = 1.0;

// SOM
let somLigado = true;
let audioContext = null;

// VOZ
let vozLigada = false;
let idioma = 'pt'; // 'pt' ou 'en'
let modoEducativo = 'off'; // 'off', 'numeros', 'cores', 'ambos'

// Textos em PT e EN
const textos = {
  numeros: {
    pt: { 1: 'um', 2: 'dois', 3: 'três', 4: 'quatro', 5: 'cinco' },
    en: { 1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five' }
  },
  cores: {
    pt: { 1: 'vermelho', 2: 'azul', 3: 'verde', 4: 'amarelo', 5: 'roxo' },
    en: { 1: 'red', 2: 'blue', 3: 'green', 4: 'yellow', 5: 'purple' }
  }
};

const tipos = [
  { cor: 'rgba(255, 70, 90, 0.9)',   numero: 1, nome: 'vermelho-1', som: 400 },
  { cor: 'rgba(60, 130, 255, 0.9)',  numero: 2, nome: 'azul-2',     som: 500 },
  { cor: 'rgba(70, 220, 120, 0.9)',  numero: 3, nome: 'verde-3',    som: 600 },
  { cor: 'rgba(255, 220, 60, 0.9)',  numero: 4, nome: 'amarelo-4',  som: 700 },
  { cor: 'rgba(180, 100, 255, 0.9)', numero: 5, nome: 'roxo-5',     som: 800 },
];

let recorde = parseInt(localStorage.getItem('recordeBolhas') || '0');
recordeEl.textContent = recorde;

// ============ PREFERÊNCIAS SALVAS ============
let prefSom = localStorage.getItem('somLigado');
if (prefSom === 'false') {
  somLigado = false;
  botaoSomEl.classList.remove('ativo');
  botaoSomEl.textContent = '🔇';
}

let prefVoz = localStorage.getItem('vozLigada');
if (prefVoz === 'true') {
  vozLigada = true;
  botaoVozEl.classList.add('ativo');
}

let prefIdioma = localStorage.getItem('idioma');
if (prefIdioma === 'en') {
  idioma = 'en';
  idiomaEl.textContent = '🇺🇸';
}

let prefModoEdu = localStorage.getItem('modoEducativo');
if (prefModoEdu) {
  modoEducativo = prefModoEdu;
  atualizarBotaoModoEdu();
}

function atualizarBotaoModoEdu() {
  const labels = {
    'off': '🎓 OFF',
    'numeros': '🎓 123',
    'cores': '🎓 🎨',
    'ambos': '🎓 123🎨'
  };
  modoEduEl.textContent = labels[modoEducativo] || '🎓 OFF';
  modoEduEl.classList.toggle('ativo', modoEducativo !== 'off');
}

// ============ ÁUDIO (SOM) ============
function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
}

function tocarPop(frequenciaBase = 600) {
  if (!somLigado || !audioContext) return;

  const agora = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const ganho = audioContext.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(frequenciaBase, agora);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 2.5, agora + 0.08);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 0.5, agora + 0.15);

  ganho.gain.setValueAtTime(0.0001, agora);
  ganho.gain.exponentialRampToValueAtTime(0.15, agora + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.15);

  osc.connect(ganho);
  ganho.connect(audioContext.destination);

  osc.start(agora);
  osc.stop(agora + 0.15);
}

function tocarCombo() {
  if (!somLigado || !audioContext) return;

  const agora = audioContext.currentTime;
  [880, 1320].forEach((freq, i) => {
    const osc = audioContext.createOscillator();
    const ganho = audioContext.createGain();
    const inicio = agora + i * 0.08;

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, inicio);

    ganho.gain.setValueAtTime(0.0001, inicio);
    ganho.gain.exponentialRampToValueAtTime(0.12, inicio + 0.01);
    ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.15);

    osc.connect(ganho);
    ganho.connect(audioContext.destination);

    osc.start(inicio);
    osc.stop(inicio + 0.15);
  });
}

// ============ VOZ ============
function falar(texto) {
  if (!vozLigada) return;
  if (!('speechSynthesis' in window)) return;

  // Cancela falas anteriores pra não acumular
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = idioma === 'pt' ? 'pt-BR' : 'en-US';
  utterance.rate = 0.9;  // um pouco mais devagar (pra criança entender)
  utterance.pitch = 1.1; // um pouco mais agudo (amigável)
  utterance.volume = 0.8;

  window.speechSynthesis.speak(utterance);
}

function falarCombo(numero, corNome) {
  if (!vozLigada || modoEducativo === 'off') return;

  const idiomaAtual = idioma;
  let texto = '';

  if (modoEducativo === 'numeros') {
    texto = textos.numeros[idiomaAtual][numero];
  } else if (modoEducativo === 'cores') {
    texto = textos.cores[idiomaAtual][corNome];
  } else if (modoEducativo === 'ambos') {
    texto = textos.numeros[idiomaAtual][numero] + ', ' + textos.cores[idiomaAtual][corNome];
  }

  if (texto) {
    // Pequeno delay pra não competir com o som de combo
    setTimeout(() => falar(texto), 300);
  }
}

// ============ FIM ÁUDIO ============

function redimensionar() {
  largura = canvas.width = window.innerWidth;
  altura = canvas.height = window.innerHeight;
}

window.addEventListener('resize', redimensionar);
redimensionar();

function criarBolha() {
  const raio = 35 + Math.random() * 25;
  const tipo = tipos[Math.floor(Math.random() * tipos.length)];
  return {
    id: Math.random().toString(36).substring(2, 9),
    x: Math.random() * (largura - raio * 2) + raio,
    y: altura + raio,
    raio: raio,
    cor: tipo.cor,
    numero: tipo.numero,
    tipoNome: tipo.nome,
    som: tipo.som,
    velocidade: (0.4 + Math.random() * 0.5) * velocidadeMultiplicador,
    oscilacao: Math.random() * Math.PI * 2,
    oscilacaoVelocidade: 0.01 + Math.random() * 0.02,
    selecionada: false,
    escala: 1.0
  };
}

function criarParticulas(x, y, cor, quantidade = 15) {
  for (let i = 0; i < quantidade; i++) {
    const angulo = (Math.PI * 2 * i) / quantidade + Math.random() * 0.5;
    const velocidade = 2 + Math.random() * 5;
    particulas.push({
      x: x,
      y: y,
      vx: Math.cos(angulo) * velocidade,
      vy: Math.sin(angulo) * velocidade,
      raio: 2 + Math.random() * 5,
      cor: cor,
      vida: 1.0,
      decaimento: 0.012 + Math.random() * 0.015
    });
  }
}

function mostrarCombo(texto, cor) {
  comboEl.textContent = texto;
  comboEl.style.color = cor || 'rgba(255, 255, 255, 0.95)';
  comboEl.classList.add('mostrar');
  setTimeout(() => {
    comboEl.classList.remove('mostrar');
  }, 700);
}

function atualizarBarraProgresso() {
  const pct = (combosFeitos / combosNecessarios) * 100;
  barraEl.style.width = pct + '%';
}

function desenhar() {
  ctx.fillStyle = 'rgba(15, 20, 40, 0.35)';
  ctx.fillRect(0, 0, largura, altura);

  if (!jogoPausado) {
    for (let i = bolhas.length - 1; i >= 0; i--) {
      const b = bolhas[i];
      b.y -= b.velocidade;
      b.oscilacao += b.oscilacaoVelocidade;
      b.x += Math.sin(b.oscilacao) * 0.5;

      const escalaAlvo = b.selecionada ? 1.15 : 1.0;
      b.escala += (escalaAlvo - b.escala) * 0.15;

      if (b.selecionada) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.raio * b.escala + 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      const grad = ctx.createRadialGradient(
        b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.1,
        b.x, b.y, b.raio * b.escala
      );
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      grad.addColorStop(0.5, b.cor);
      grad.addColorStop(1, b.cor.replace('0.9', '0.5'));

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.raio * b.escala, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fill();

      ctx.save();
      ctx.font = `bold ${b.raio * 0.9}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillText(b.numero, b.x + 2, b.y + 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillText(b.numero, b.x, b.y);
      ctx.restore();

      if (b.y + b.raio < 0) {
        const idxSel = bolhasSelecionadas.indexOf(b);
        if (idxSel > -1) bolhasSelecionadas.splice(idxSel, 1);
        bolhas.splice(i, 1);
      }
    }
  }

  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.vida -= p.decaimento;

    if (p.vida <= 0) {
      particulas.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.raio * p.vida, 0, Math.PI * 2);
    ctx.fillStyle = p.cor.replace('0.9', p.vida.toFixed(2));
    ctx.fill();
  }

  requestAnimationFrame(desenhar);
}

function gerarBolhas() {
  if (jogoPausado) {
    setTimeout(gerarBolhas, 500);
    return;
  }

  const maxBolhas = modoZen ? 8 : 10;
  if (bolhas.length < maxBolhas) {
    bolhas.push(criarBolha());
  }
  setTimeout(gerarBolhas, modoZen ? 1200 : 800);
}

function limparSelecionadas() {
  bolhasSelecionadas.forEach(b => {
    b.selecionada = false;
  });
  bolhasSelecionadas = [];
}

function atualizarContador() {
  estouradasEl.textContent = estouradas;
  estouradasEl.classList.add('pulso');
  setTimeout(() => estouradasEl.classList.remove('pulso'), 200);

  if (estouradas > recorde) {
    recorde = estouradas;
    localStorage.setItem('recordeBolhas', recorde);
    recordeEl.textContent = recorde;
  }
}

function passarDeFase() {
  jogoPausado = true;
  overlayTituloEl.textContent = 'FASE ' + fase + ' COMPLETA!';
  overlayTextoEl.textContent = 'Próxima fase: ' + (combosNecessarios + 2) + ' combos';
  overlayEl.classList.add('mostrar');
}

function proximaFase() {
  fase++;
  combosFeitos = 0;
  combosNecessarios += 2;
  velocidadeMultiplicador += 0.2;

  numeroFaseEl.textContent = fase;
  atualizarBarraProgresso();

  bolhas = [];
  particulas = [];
  bolhasSelecionadas = [];
  jogoPausado = false;

  overlayEl.classList.remove('mostrar');
}

function clicar(x, y) {
  if (jogoPausado) return;

  initAudio();

  for (let i = bolhas.length - 1; i >= 0; i--) {
    const b = bolhas[i];
    const dist = Math.hypot(x - b.x, y - b.y);
    if (dist < b.raio) {

      if (modoZen) {
        tocarPop(b.som);
        criarParticulas(b.x, b.y, b.cor);
        bolhas.splice(i, 1);
        estouradas++;
        atualizarContador();
        return;
      }

      if (b.selecionada) {
        b.selecionada = false;
        const idxSel = bolhasSelecionadas.indexOf(b);
        if (idxSel > -1) bolhasSelecionadas.splice(idxSel, 1);
        return;
      }

      if (bolhasSelecionadas.length === 0) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);
        return;
      }

      const primeira = bolhasSelecionadas[0];

      if (b.tipoNome === primeira.tipoNome) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);

        if (bolhasSelecionadas.length === 3) {
          estouradas += 3;
          combosFeitos++;
          atualizarContador();
          atualizarBarraProgresso();
          mostrarCombo('COMBO! +3', primeira.cor);
          tocarCombo();

          // Fala o número e/ou cor
          falarCombo(primeira.numero, primeira.numero);

          bolhasSelecionadas.forEach(sel => {
            criarParticulas(sel.x, sel.y, sel.cor, 20);
          });

          bolhasSelecionadas.forEach(sel => {
            const idx = bolhas.indexOf(sel);
            if (idx > -1) bolhas.splice(idx, 1);
          });

          bolhasSelecionadas = [];

          if (combosFeitos >= combosNecessarios) {
            setTimeout(passarDeFase, 500);
          }
        }
      } else {
        limparSelecionadas();
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);
      }
      return;
    }
  }

  limparSelecionadas();
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clicar(e.clientX, e.clientY);
});

modoEl.addEventListener('click', () => {
  modoZen = !modoZen;
  modoEl.textContent = modoZen ? 'MODO NORMAL' : 'MODO ZEN';
  document.getElementById('ui').style.opacity = modoZen ? '0.3' : '1';
  document.getElementById('fase').style.opacity = modoZen ? '0.3' : '1';
  instrucaoEl.textContent = modoZen ? 'Modo Zen - estoure qualquer bolha' : 'Junte 3 bolhas com a MESMA cor e o MESMO número!';
  limparSelecionadas();
});

botaoSomEl.addEventListener('click', () => {
  somLigado = !somLigado;
  localStorage.setItem('somLigado', somLigado);
  botaoSomEl.classList.toggle('ativo', somLigado);
  botaoSomEl.textContent = somLigado ? '🔊' : '🔇';
  if (somLigado) {
    initAudio();
    tocarPop(600);
  }
});

botaoVozEl.addEventListener('click', () => {
  vozLigada = !vozLigada;
  localStorage.setItem('vozLigada', vozLigada);
  botaoVozEl.classList.toggle('ativo', vozLigada);
  if (vozLigada) {
    // Fala uma amostra pra confirmar que tá funcionando
    setTimeout(() => falar(idioma === 'pt' ? 'Voz ativada' : 'Voice on'), 100);
  }
});

idiomaEl.addEventListener('click', () => {
  idioma = idioma === 'pt' ? 'en' : 'pt';
  localStorage.setItem('idioma', idioma);
  idiomaEl.textContent = idioma === 'pt' ? '🇧🇷' : '🇺🇸';

  // Feedback
  if (vozLigada) {
    setTimeout(() => falar(idioma === 'pt' ? 'Português' : 'English'), 100);
  }
});

modoEduEl.addEventListener('click', () => {
  const modos = ['off', 'numeros', 'cores', 'ambos'];
  const atual = modos.indexOf(modoEducativo);
  modoEducativo = modos[(atual + 1) % modos.length];
  localStorage.setItem('modoEducativo', modoEducativo);
  atualizarBotaoModoEdu();

  // Feedback
  if (vozLigada && modoEducativo !== 'off') {
    const exemplos = {
      'numeros': idioma === 'pt' ? 'dois' : 'two',
      'cores': idioma === 'pt' ? 'vermelho' : 'red',
      'ambos': idioma === 'pt' ? 'dois, vermelho' : 'two, red'
    };
    setTimeout(() => falar(exemplos[modoEducativo]), 100);
  }
});

overlayBotaoEl.addEventListener('click', proximaFase);

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    fase = 1;
    combosFeitos = 0;
    combosNecessarios = 3;
    velocidadeMultiplicador = 1.0;
    estouradas = 0;
    bolhas = [];
    particulas = [];
    bolhasSelecionadas = [];
    jogoPausado = false;
    numeroFaseEl.textContent = 1;
    atualizarContador();
    atualizarBarraProgresso();
    overlayEl.classList.remove('mostrar');
  }
});

atualizarBarraProgresso();
gerarBolhas();
desenhar();
</script>

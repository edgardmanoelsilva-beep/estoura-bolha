<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1fae7.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1fae7.png">
<title>Bolha Kids - Aprender Brincando</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); touch-action: manipulation; }

.tela { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
.tela.ativa { display: flex; }

#telaInicial { background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%); padding: 20px; text-align: center; overflow-y: auto; }
#telaInicial .bolhas-fundo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
.bolha-decorativa { position: absolute; border-radius: 50%; opacity: 0.3; animation: flutuar 8s ease-in-out infinite; }
@keyframes flutuar { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.1); } }

#telaInicial .conteudo { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; max-width: 600px; padding-top: 50px; }

.idiomas-topo { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }

.botao-idioma { font-size: 16px; font-weight: 700; padding: 10px 20px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 30px; cursor: pointer; color: white; font-family: inherit; transition: all 0.2s; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); touch-action: manipulation; letter-spacing: 1px; }
.botao-idioma:active { transform: scale(0.95); }
.botao-idioma.ativo { background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); border-color: transparent; box-shadow: 0 4px 15px rgba(255,220,60,0.5); }

.botao-config-inicial { position: absolute; top: 20px; right: 20px; width: 55px; height: 55px; font-size: 26px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); touch-action: manipulation; }
.botao-config-inicial:active { transform: scale(0.9); }

.botao-instalar { position: absolute; top: 20px; right: 90px; padding: 12px 20px; font-size: 14px; font-weight: 700; background: linear-gradient(135deg, #46dc78 0%, #2a9d4f 100%); border: none; border-radius: 30px; cursor: pointer; color: white; font-family: inherit; letter-spacing: 1px; display: none; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(70,220,120,0.5); touch-action: manipulation; z-index: 10; animation: instalarPulsar 2s ease-in-out infinite; }
@keyframes instalarPulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.botao-instalar.visivel { display: flex; }
.botao-instalar:active { transform: scale(0.95); }

.logo-titulo { font-size: 60px; font-weight: 900; color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.3); letter-spacing: 2px; line-height: 1; animation: pulsarLogo 3s ease-in-out infinite; }
@keyframes pulsarLogo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.logo-sub { font-size: 16px; color: rgba(255,255,255,0.9); font-weight: 400; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }

.pergunta { font-size: 18px; font-weight: 700; color: white; margin-top: 10px; margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

.opcoes-grupo { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; padding: 0 10px; }

.botao-opcao { flex: 1; min-width: 110px; padding: 16px 12px; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.4); border-radius: 20px; cursor: pointer; font-family: inherit; color: white; font-size: 15px; font-weight: 700; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; letter-spacing: 1px; touch-action: manipulation; backdrop-filter: blur(10px); }
.botao-opcao .emoji { font-size: 34px; line-height: 1; }
.botao-opcao:active { transform: scale(0.95); }
.botao-opcao.ativo { background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); border-color: transparent; box-shadow: 0 6px 20px rgba(255,220,60,0.5); }

.botao-iniciar { font-size: 26px; font-weight: 800; padding: 20px 60px; background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); color: white; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #cc7a1e, 0 15px 30px rgba(0,0,0,0.3); transition: all 0.15s; font-family: inherit; letter-spacing: 3px; text-transform: uppercase; touch-action: manipulation; margin-top: 15px; }
.botao-iniciar:active { transform: translateY(6px); box-shadow: 0 4px 0 #cc7a1e, 0 8px 15px rgba(0,0,0,0.3); }

#telaJogo { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
#canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
.controles-jogo { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
.botao-jogo { width: 50px; height: 50px; font-size: 22px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); color: white; touch-action: manipulation; font-family: inherit; }
.botao-jogo:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }

#ui { position: fixed; top: 15px; left: 15px; color: rgba(255,255,255,0.6); font-size: 14px; pointer-events: none; font-weight: 300; letter-spacing: 1px; }
#estouradas { font-size: 42px; font-weight: 700; color: rgba(255,255,255,0.9); display: block; margin-bottom: 3px; transition: transform 0.2s ease, color 0.3s; }
#estouradas.pulso { transform: scale(1.25); color: #ffdc3c; }
#recorde { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }

#fase { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.9); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; text-align: center; font-weight: 300; z-index: 5; }
#fase .titulo { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 3px; }
#fase .numero { font-size: 22px; font-weight: 600; display: block; margin: 2px 0; color: #ffdc3c; }

#progressoWrap { width: 220px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; margin: 6px auto 0; overflow: hidden; }
#barra { height: 100%; width: 0%; background: linear-gradient(90deg, #ffdc3c, #ff9a3c); transition: width 0.4s ease; border-radius: 4px; }

#instrucao { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; animation: fadeInOut 3s ease-in-out infinite; text-align: center; padding: 0 20px; max-width: 90vw; }
@keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }

#combo { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); color: rgba(255,255,255,0.95); font-size: 50px; font-weight: 900; pointer-events: none; transition: transform 0.4s, opacity 0.6s; opacity: 0; text-shadow: 0 0 40px rgba(255,220,60,0.8); text-align: center; z-index: 8; padding: 0 20px; }
#combo.mostrar { transform: translate(-50%,-50%) scale(1); opacity: 1; }

#flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 0.4s; }
#flash.ativo { opacity: 0.15; transition: opacity 0.05s; }

#telaFaseCompleta { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; flex-direction: column; color: white; z-index: 30; text-align: center; padding: 20px; overflow: hidden; }
#telaFaseCompleta.ativa { display: flex; }
#fundoAnimado { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; }
#emojisFesta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
.emojiFesta { position: absolute; font-size: 60px; animation: emojiSubir 3s ease-out forwards; }
@keyframes emojiSubir {
  0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
  20% { opacity: 1; transform: translateY(-20px) rotate(45deg) scale(1.2); }
  100% { transform: translateY(-100vh) rotate(360deg) scale(1); opacity: 0; }
}
#telaFaseCompleta .conteudoFinal { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
#telaFaseCompleta h1 { font-size: 52px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 40px rgba(255,220,60,0.8), 0 0 20px rgba(255,255,255,0.5); letter-spacing: 3px; color: #ffdc3c; animation: tituloPular 1s ease-in-out infinite; }
@keyframes tituloPular { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.05); } }
.estrelas-container { display: flex; gap: 15px; margin: 20px 0 25px; }
.estrela { font-size: 72px; opacity: 0.2; transition: opacity 0.5s, transform 0.5s; display: inline-block; }
.estrela.ativa { opacity: 1; animation: estrelaGirar 1.5s ease-in-out infinite; }
@keyframes estrelaGirar { 0%, 100% { transform: scale(1.1) rotate(0deg); } 50% { transform: scale(1.3) rotate(20deg); } }
#telaFaseCompleta .mensagem { font-size: 22px; color: rgba(255,255,255,0.95); letter-spacing: 2px; margin-bottom: 30px; font-weight: 500; }
#botaoContinuar { font-size: 22px; font-weight: 800; padding: 20px 60px; background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); border: none; color: white; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #cc7a1e; transition: all 0.15s; font-family: inherit; letter-spacing: 3px; text-transform: uppercase; touch-action: manipulation; animation: botaoPulsar 1.2s ease-in-out infinite; position: relative; z-index: 5; }
@keyframes botaoPulsar { 0%, 100% { transform: scale(1); box-shadow: 0 10px 0 #cc7a1e; } 50% { transform: scale(1.08); box-shadow: 0 10px 0 #cc7a1e, 0 0 30px rgba(255,220,60,0.7); } }
#botaoContinuar:active { transform: translateY(6px); box-shadow: 0 4px 0 #cc7a1e; animation: none; }

#particulasFesta { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 29; }

#telaConfig { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 20px; overflow-y: auto; justify-content: flex-start; padding-top: 80px; }
.config-titulo { font-size: 32px; font-weight: 800; color: white; margin-bottom: 30px; letter-spacing: 2px; text-align: center; }
.config-item { width: 100%; max-width: 500px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: white; font-size: 16px; font-weight: 500; letter-spacing: 1px; }
.config-item .rotulo { display: flex; align-items: center; gap: 10px; }
.config-item .rotulo .icone { font-size: 24px; }
.opcoes { display: flex; gap: 6px; }
.opcao { padding: 8px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.7); transition: all 0.2s; font-family: inherit; font-weight: 500; min-width: 50px; text-align: center; touch-action: manipulation; }
.opcao:active { transform: scale(0.95); }
.opcao.ativa { background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); color: white; border-color: transparent; font-weight: 700; box-shadow: 0 3px 10px rgba(255,220,60,0.4); }
.botao-voltar { position: fixed; top: 20px; left: 20px; width: 60px; height: 60px; font-size: 28px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center; color: white; backdrop-filter: blur(10px); touch-action: manipulation; }
.botao-voltar:active { transform: scale(0.9); }

@media (max-width: 500px) {
  .logo-titulo { font-size: 44px; }
  .logo-sub { font-size: 13px; letter-spacing: 2px; }
  .botao-iniciar { font-size: 22px; padding: 18px 45px; }
  .botao-opcao { min-width: 95px; padding: 14px 8px; font-size: 13px; }
  .botao-opcao .emoji { font-size: 26px; }
  .pergunta { font-size: 16px; }
  .botao-idioma { font-size: 14px; padding: 8px 16px; }
  .botao-instalar { font-size: 12px; padding: 10px 14px; right: 80px; }
  #telaFaseCompleta h1 { font-size: 34px; }
  .estrela { font-size: 52px; }
  #botaoContinuar { font-size: 18px; padding: 16px 40px; }
  .emojiFesta { font-size: 42px; }
  .config-item { flex-direction: column; align-items: flex-start; gap: 10px; }
  .opcoes { width: 100%; justify-content: space-between; }
  .opcao { flex: 1; padding: 10px 6px; font-size: 13px; }
  .config-titulo { font-size: 24px; }
  #fase .numero { font-size: 20px; }
  #estouradas { font-size: 32px; }
  #progressoWrap { width: 180px; }
}
</style>
</head>
<body>

<div class="tela ativa" id="telaInicial">
  <div class="bolhas-fundo" id="bolhasFundo"></div>
  <div class="idiomas-topo">
    <button class="botao-idioma ativo" data-idioma="pt">🇧🇷 PT</button>
    <button class="botao-idioma" data-idioma="en">🇺🇸 EN</button>
  </div>
  <button class="botao-instalar" id="btnInstalar">📲 Instalar</button>
  <button class="botao-config-inicial" id="btnAbrirConfig" title="Configurações">⚙️</button>
  <div class="conteudo">
    <div class="logo-titulo">Bolha Kids</div>
    <div class="logo-sub" id="subtitulo">Aprender Brincando</div>
    <div class="pergunta" id="perguntaAprender">O que aprender?</div>
    <div class="opcoes-grupo">
      <button class="botao-opcao ativo" data-aprender="numeros">
        <span class="emoji">🔢</span>
        <span id="labelNumeros">Números</span>
      </button>
      <button class="botao-opcao" data-aprender="cores">
        <span class="emoji">🎨</span>
        <span id="labelCores">Cores</span>
      </button>
      <button class="botao-opcao" data-aprender="ambos">
        <span class="emoji">🔢🎨</span>
        <span id="labelAmbos">Ambos</span>
      </button>
    </div>
    <button class="botao-iniciar" id="btnIniciar">
      <span id="labelIniciar">▶ Iniciar</span>
    </button>
  </div>
</div>

<div class="tela" id="telaJogo">
  <canvas id="canvas"></canvas>
  <div class="controles-jogo">
    <button class="botao-jogo" id="btnHome" title="Início">🏠</button>
    <button class="botao-jogo" id="btnConfig" title="Configurações">⚙️</button>
  </div>
  <div id="ui">
    <span id="estouradas">0</span>
    <span id="labelBolhas">combos</span>
    <div id="recorde"><span id="labelRecorde">Recorde:</span> <span id="recordeValor">0</span></div>
  </div>
  <div id="fase">
    <div class="titulo" id="labelFase">FASE</div>
    <span class="numero" id="numeroFase">1</span>
    <div id="progressoWrap"><div id="barra"></div></div>
    <div style="font-size:10px; margin-top:4px; color: rgba(255,255,255,0.6);"><span id="acertosFase">0</span>/<span id="acertosNecessarios">10</span></div>
  </div>
  <div id="combo"></div>
  <div id="flash"></div>
  <div id="instrucao">Junte 3 bolhas iguais!</div>
</div>

<div id="telaFaseCompleta">
  <canvas id="fundoAnimado"></canvas>
  <div id="emojisFesta"></div>
  <div class="conteudoFinal">
    <h1 id="tituloFaseCompleta">FASE COMPLETA!</h1>
    <div class="estrelas-container">
      <div class="estrela" id="estrela1">⭐</div>
      <div class="estrela" id="estrela2">⭐</div>
      <div class="estrela" id="estrela3">⭐</div>
    </div>
    <div class="mensagem" id="mensagemFase">Você completou 10 combos!</div>
    <button id="botaoContinuar">Continuar</button>
  </div>
</div>

<canvas id="particulasFesta"></canvas>

<div class="tela" id="telaConfig">
  <button class="botao-voltar" id="btnVoltar" title="Voltar">←</button>
  <div class="config-titulo">⚙️ <span id="configTitulo">Configurações</span></div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🔊</span> <span id="labelSom">Som</span></div>
    <div class="opcoes" id="opcoesSom">
      <button class="opcao" data-valor="on" id="opSomOn">Ligado</button>
      <button class="opcao" data-valor="off" id="opSomOff">Desligado</button>
    </div>
  </div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🗣️</span> <span id="labelVoz">Voz</span></div>
    <div class="opcoes" id="opcoesVoz">
      <button class="opcao" data-valor="on" id="opVozOn">Ligada</button>
      <button class="opcao" data-valor="off" id="opVozOff">Desligada</button>
    </div>
  </div>
</div>

<script>

let telaAtual = 'inicial';
let largura = 0, altura = 0;
let bolhas = [];

let estouradas = 0;
let bolhasSelecionadas = [];

const traducoes = {

function initAudio() {
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') audioContext.resume();
}

function tocarPop(frequenciaBase = 600) {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const ganho = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(frequenciaBase, agora);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 2.5, agora + 0.08);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 0.5, agora + 0.15);
  ganho.gain.setValueAtTime(0.0001, agora);
  ganho.gain.exponentialRampToValueAtTime(0.15, agora + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.15);
  osc.connect(ganho); ganho.connect(audioContext.destination);
  osc.start(agora); osc.stop(agora + 0.15);
}

function tocarSelecao(freq) {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const ganho = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq * 1.5, agora);
  ganho.gain.setValueAtTime(0.0001, agora);
  ganho.gain.exponentialRampToValueAtTime(0.1, agora + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.1);
  osc.connect(ganho); ganho.connect(audioContext.destination);
  osc.start(agora); osc.stop(agora + 0.1);
}

function tocarTriunfo() {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const notas = [523, 659, 784];
  notas.forEach((freq, i) => {
    const osc = audioContext.createOscillator();
    const ganho = audioContext.createGain();
    const inicio = agora + i * 0.08;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, inicio);
    ganho.gain.setValueAtTime(0.0001, inicio);
    ganho.gain.exponentialRampToValueAtTime(0.18, inicio + 0.02);
    ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.3);
    osc.connect(ganho); ganho.connect(audioContext.destination);
    osc.start(inicio); osc.stop(inicio + 0.3);
  });
}

function tocarErro() {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const ganho = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, agora);
  osc.frequency.exponentialRampToValueAtTime(150, agora + 0.2);
  ganho.gain.setValueAtTime(0.0001, agora);
  ganho.gain.exponentialRampToValueAtTime(0.1, agora + 0.02);
  ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.2);
  osc.connect(ganho); ganho.connect(audioContext.destination);
  osc.start(agora); osc.stop(agora + 0.2);
}

function tocarFanfarra() {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const melodia = [
    { f: 523, t: 0.0,  d: 0.25 }, { f: 523, t: 0.3,  d: 0.25 },
    { f: 587, t: 0.6,  d: 0.5 },  { f: 523, t: 1.2,  d: 0.5 },
    { f: 698, t: 1.8,  d: 0.5 },  { f: 659, t: 2.4,  d: 1.0 },
    { f: 523, t: 3.6,  d: 0.25 }, { f: 523, t: 3.9,  d: 0.25 },
    { f: 587, t: 4.2,  d: 0.5 },  { f: 523, t: 4.8,  d: 0.5 },
    { f: 784, t: 5.4,  d: 0.5 },  { f: 698, t: 6.0,  d: 1.5 }
  ];
  melodia.forEach(nota => {
    const osc = audioContext.createOscillator();
    const ganho = audioContext.createGain();
    const inicio = agora + nota.t;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(nota.f, inicio);
    ganho.gain.setValueAtTime(0.0001, inicio);
    ganho.gain.exponentialRampToValueAtTime(0.18, inicio + 0.03);
    ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + nota.d);
    osc.connect(ganho); ganho.connect(audioContext.destination);
    osc.start(inicio); osc.stop(inicio + nota.d + 0.05);
  });
}

function desenharForma(forma, x, y, tamanho) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  const r = tamanho * 0.45;
  if (forma === 'circulo') ctx.arc(x, y, r, 0, Math.PI * 2);
  else if (forma === 'quadrado') ctx.rect(x - r, y - r, r * 2, r * 2);
  else if (forma === 'triangulo') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y + r); ctx.lineTo(x - r, y + r); ctx.closePath(); }
  else if (forma === 'estrela') {
    for (let i = 0; i < 5; i++) {
      const ang = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      const x1 = x + Math.cos(ang) * r;
      const y1 = y + Math.sin(ang) * r;
      const ang2 = ang + Math.PI / 5;
      const x2 = x + Math.cos(ang2) * r * 0.5;
      const y2 = y + Math.sin(ang2) * r * 0.5;
      if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();
  } else if (forma === 'losango') {
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.7, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.7, y); ctx.closePath();
  }
  ctx.fill(); ctx.stroke(); ctx.restore();
}

function criarBolha() {
  const raio = 42 + Math.random() * 18;
  const corSorteada = getCoresDisponiveis()[Math.floor(Math.random() * getCoresDisponiveis().length)];
  const numeroSorteado = getNumerosDisponiveis()[Math.floor(Math.random() * getNumerosDisponiveis().length)];
  let corFinal, corNomeFinal, somFinal, temBordaFinal;
  if (modoEducativo === 'numeros') {
    corFinal = 'rgba(180,180,190,0.95)';
    corNomeFinal = 'cinza';
    somFinal = 500;
    temBordaFinal = false;
  } else {
    corFinal = corSorteada.cor;
    corNomeFinal = corSorteada.nome;
    somFinal = corSorteada.som;
    temBordaFinal = corSorteada.borda || false;
  }
  return {
    id: Math.random().toString(36).substring(2, 9),
    x: raio + 20 + Math.random() * (largura - (raio + 20) * 2),
    y: altura + raio,
    raio: raio,
    cor: corFinal,
    corNome: corNomeFinal,
    som: somFinal,
    temBorda: temBordaFinal,
    numero: numeroSorteado,
    forma: formasPorCor[corSorteada.nome] || 'circulo',
    velocidade: 0.5 + Math.random() * 0.4,
    oscilacao: Math.random() * Math.PI * 2,
    oscilacaoVelocidade: 0.01 + Math.random() * 0.02,
    selecionada: false,
    escala: 1.0,
    tremendo: 0,
    nascer: 0
  };
}

function criarParticulas(x, y, cor, qtd = 20) {
  for (let i = 0; i < qtd; i++) {
    const ang = (Math.PI * 2 * i) / qtd + Math.random() * 0.5;
    const vel = 2 + Math.random() * 5;
    particulas.push({ x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, raio: 2 + Math.random() * 5, cor, vida: 1.0, decaimento: 0.012 + Math.random() * 0.015 });
  }
}

function criarEstrelinhas(x, y) {
  for (let i = 0; i < 6; i++) {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
    const vel = 2 + Math.random() * 3;
    particulas.push({ x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel - 1, raio: 4 + Math.random() * 4, cor: 'rgba(255,220,60,0.95)', vida: 1.0, decaimento: 0.015, estrela: true });
  }
}

function desenhar() {
  if (telaAtual !== 'jogo') { requestAnimationFrame(desenhar); return; }
  ctx.fillStyle = 'rgba(15,20,40,0.35)';
  ctx.fillRect(0, 0, largura, altura);
  if (!jogoPausado) {
    for (let i = bolhas.length - 1; i >= 0; i--) {
      const b = bolhas[i];
      if (b.tremendo > 0) b.tremendo -= 1;
      if (b.nascer < 1) b.nascer += 0.08;
      b.y -= b.velocidade;
      b.oscilacao += b.oscilacaoVelocidade;
      b.x += Math.sin(b.oscilacao) * 0.5;
      const escalaAlvo = b.selecionada ? 1.18 : 1.0;
      b.escala += (escalaAlvo - b.escala) * 0.15;
      let offsetX = 0;
      if (b.tremendo > 0) offsetX = Math.sin(b.tremendo * 1.5) * 8;
      const escalaFinal = b.raio * b.escala * b.nascer;
      if (b.selecionada) {
        ctx.beginPath();
        ctx.arc(b.x + offsetX, b.y, escalaFinal + 10, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
      const grad = ctx.createRadialGradient(b.x + offsetX - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.1, b.x + offsetX, b.y, escalaFinal);
      grad.addColorStop(0, 'rgba(255,255,255,0.7)');
      grad.addColorStop(0.5, b.cor);
      grad.addColorStop(1, b.cor.replace(/0\.9|0\.95/, '0.5'));
      ctx.beginPath();
      ctx.arc(b.x + offsetX, b.y, escalaFinal, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      if (b.temBorda) {
        ctx.beginPath();
        ctx.arc(b.x + offsetX, b.y, escalaFinal, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(b.x + offsetX - b.raio * 0.3, b.y - b.raio * 0.3, escalaFinal * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();
      if (modoEducativo === 'cores') {
        desenharForma(b.forma, b.x + offsetX, b.y, escalaFinal);
      } else if (modoEducativo === 'numeros') {
        ctx.save();
        ctx.font = `bold ${escalaFinal * 0.9}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(b.numero, b.x + offsetX + 2, b.y + 2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillText(b.numero, b.x + offsetX, b.y);
        ctx.restore();
      } else {
        ctx.save();
        ctx.font = `bold ${escalaFinal * 0.9}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(b.numero, b.x + offsetX + 2, b.y + 2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillText(b.numero, b.x + offsetX, b.y);
        ctx.restore();
      }
      if (b.y + b.raio < 0) {
        const idx = bolhasSelecionadas.indexOf(b);
        if (idx > -1) bolhasSelecionadas.splice(idx, 1);
        bolhas.splice(i, 1);
        if (!jogoPausado) bolhas.push(criarBolha());
      }
    }
  }
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vida -= p.decaimento;
    if (p.vida <= 0) { particulas.splice(i, 1); continue; }
    if (p.estrela) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.font = `${p.raio * 2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = p.vida;
      ctx.fillText('⭐', 0, 0);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.raio * p.vida, 0, Math.PI * 2);
      ctx.fillStyle = p.cor.replace(/0\.9|0\.95/, p.vida.toFixed(2));
      ctx.fill();
    }
  }
  requestAnimationFrame(desenhar);
}
desenhar();

}

function calcularEstrelas() {
  if (errosNaFase <= 2) return 3;
  if (errosNaFase <= 5) return 2;
  return 1;
}

let festaParticulas = [];
function iniciarFesta() {
  festaParticulas = [];
  const coresFesta = ['#ffdc3c','#ff465a','#3c82ff','#46dc78','#b464ff','#ff9a3c'];
  for (let i = 0; i < 300; i++) {
    festaParticulas.push({
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 5,
      raio: 4 + Math.random() * 9,
      cor: coresFesta[Math.floor(Math.random() * coresFesta.length)],
      rotacao: Math.random() * Math.PI * 2,
      rotacaoVel: (Math.random() - 0.5) * 0.3,
      vida: 1.0,
      tipo: Math.random() < 0.3 ? 'estrela' : 'retangulo'
    });
  }
}

function desenharFesta() {
  if (!telaFaseCompleta.classList.contains('ativa')) {
    ctxFesta.clearRect(0, 0, particulasFesta.width, particulasFesta.height);
    requestAnimationFrame(desenharFesta);
    return;
  }
  ctxFesta.clearRect(0, 0, particulasFesta.width, particulasFesta.height);
  for (let i = festaParticulas.length - 1; i >= 0; i--) {
    const p = festaParticulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.rotacao += p.rotacaoVel;
    if (p.y > particulasFesta.height + 30) { festaParticulas.splice(i, 1); continue; }
    if (p.tipo === 'estrela') {
      ctxFesta.save();
      ctxFesta.translate(p.x, p.y);
      ctxFesta.rotate(p.rotacao);
      ctxFesta.font = `${p.raio * 2}px serif`;
      ctxFesta.textAlign = 'center';
      ctxFesta.textBaseline = 'middle';
      ctxFesta.fillText('⭐', 0, 0);
      ctxFesta.restore();
    } else {
      ctxFesta.save();
      ctxFesta.translate(p.x, p.y);
      ctxFesta.rotate(p.rotacao);
      ctxFesta.fillStyle = p.cor;
      ctxFesta.fillRect(-p.raio/2, -p.raio/2, p.raio, p.raio * 0.6);
      ctxFesta.restore();
    }
  }
  requestAnimationFrame(desenharFesta);
}
desenharFesta();

let tempoFundo = 0;
function desenharFundo() {
  if (!telaFaseCompleta.classList.contains('ativa')) {
    requestAnimationFrame(desenharFundo);
    return;
  }
  tempoFundo += 0.01;
  const w = fundoAnimado.width;
  const h = fundoAnimado.height;
  const grad = ctxFundo.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, `hsl(${(tempoFundo * 50) % 360}, 70%, 50%)`);
  grad.addColorStop(0.5, `hsl(${(tempoFundo * 50 + 120) % 360}, 70%, 50%)`);
  grad.addColorStop(1, `hsl(${(tempoFundo * 50 + 240) % 360}, 70%, 50%)`);
  ctxFundo.fillStyle = grad;
  ctxFundo.fillRect(0, 0, w, h);
  requestAnimationFrame(desenharFundo);
}
desenharFundo();

function soltarEmojis() {
  emojisFestaEl.innerHTML = '';
  const emojis = ['🎉', '🎊', '🎈', '⭐', '✨', '🌟', '🏆', '💫'];
  for (let i = 0; i < 15; i++) {
    const e = document.createElement('div');
    e.className = 'emojiFesta';
    e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    e.style.left = Math.random() * 90 + '%';
    e.style.bottom = '-80px';
    e.style.animationDelay = (Math.random() * 1.5) + 's';
    e.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
    e.style.fontSize = (40 + Math.random() * 40) + 'px';
    emojisFestaEl.appendChild(e);
  }
}

function pegarFrase(fase) {
  const frases = traducoes[idioma].frases;
  return frases[(fase - 1) % frases.length];
}

function passarDeFase() {
  faseCompleta = true;
  jogoPausado = true;
  const estrelas = calcularEstrelas();
  const t = traducoes[idioma];
  const frase = pegarFrase(fase);
  document.getElementById('tituloFaseCompleta').textContent = frase;
  document.getElementById('mensagemFase').textContent = t.completou + ' ' + acertosNaFase + ' ' + t.vezes;
  document.getElementById('estrela1').classList.remove('ativa');
  document.getElementById('estrela2').classList.remove('ativa');
  document.getElementById('estrela3').classList.remove('ativa');
  setTimeout(() => document.getElementById('estrela1').classList.add('ativa'), 300);
  if (estrelas >= 2) setTimeout(() => document.getElementById('estrela2').classList.add('ativa'), 700);
  if (estrelas >= 3) setTimeout(() => document.getElementById('estrela3').classList.add('ativa'), 1100);
  iniciarFesta();
  soltarEmojis();
  tocarFanfarra();
  falarFaseCompleta(frase);
  telaFaseCompleta.classList.add('ativa');
  setTimeout(() => { if (telaFaseCompleta.classList.contains('ativa')) soltarEmojis(); }, 2000);
}

function proximaFase() {
  telaFaseCompleta.classList.remove('ativa');
  fase++;
  acertosNaFase = 0;
  errosNaFase = 0;
  acertosNecessarios = 10 + (fase - 1) * 2;
  numeroFaseEl.textContent = fase;
  atualizarBarraProgresso();
  jogoPausado = false;
  faseCompleta = false;
  bolhasSelecionadas = [];
  gerarBolhasIniciais();
}

botaoContinuar.addEventListener('click', proximaFase);

function limparSelecionadas() {
  bolhasSelecionadas.forEach(b => b.selecionada = false);
  bolhasSelecionadas = [];
}

function saoIguais(a, b) {
  if (modoEducativo === 'cores') return a.corNome === b.corNome;
  if (modoEducativo === 'numeros') return a.numero === b.numero;
  return a.corNome === b.corNome && a.numero === b.numero;
}

function clicar(x, y) {
  if (jogoPausado || faseCompleta) return;
  initAudio();
  for (let i = bolhas.length - 1; i >= 0; i--) {
    const b = bolhas[i];
    if (Math.hypot(x - b.x, y - b.y) < b.raio) {
      if (b.selecionada) {
        b.selecionada = false;
        const idx = bolhasSelecionadas.indexOf(b);
        if (idx > -1) bolhasSelecionadas.splice(idx, 1);
        return;
      }
      if (bolhasSelecionadas.length === 0) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarSelecao(b.som);
        criarEstrelinhas(b.x, b.y - b.raio);
        return;
      }
      const primeira = bolhasSelecionadas[0];
      if (saoIguais(b, primeira)) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarSelecao(b.som);
        criarEstrelinhas(b.x, b.y - b.raio);
        if (bolhasSelecionadas.length === 3) {
          const numero = primeira.numero;
          const corNome = primeira.corNome;
          bolhasSelecionadas.forEach(sel => {
            criarParticulas(sel.x, sel.y, sel.cor, 30);
            const idx = bolhas.indexOf(sel);
            if (idx > -1) bolhas.splice(idx, 1);
          });
          bolhasSelecionadas = [];
          estouradas++;
          acertosNaFase++;
          atualizarContador();
          atualizarBarraProgresso();
          mostrarCombo('✓', 'rgba(255,220,60,0.95)');
          tocarTriunfo();
          ativarFlash();
          falarCombo(numero, corNome);
          setTimeout(() => { for (let k = 0; k < 3; k++) bolhas.push(criarBolha()); }, 400);
          if (acertosNaFase >= acertosNecessarios) {
            setTimeout(passarDeFase, 2200);
          }
        }
      } else {
        b.tremendo = 20;
        tocarErro();
        errosNaFase++;
        limparSelecionadas();
      }
      return;
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clicar(e.clientX, e.clientY);
});

// ============ PWA ============
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstalar.classList.add('visivel');
});

btnInstalar.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  btnInstalar.classList.remove('visivel');
});

window.addEventListener('appinstalled', () => {
  btnInstalar.classList.remove('visivel');
  deferredPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => console.log('Service Worker registrado:', reg.scope))
      .catch((err) => console.error('Erro no Service Worker:', err));
  });
}

// ============ INICIALIZAÇÃO ============
const idiomaSalvo = localStorage.getItem('idioma');
if (idiomaSalvo) idioma = idiomaSalvo;

const modoSalvo = localStorage.getItem('modoEducativo');
if (modoSalvo) modoEducativo = modoSalvo;

const somSalvo = localStorage.getItem('somLigado');
if (somSalvo === 'false') somLigado = false;

const vozSalva = localStorage.getItem('vozLigada');
if (vozSalva === 'false') vozLigada = false;

atualizarBotoesIdioma();
atualizarBotoesAprender();
aplicarTraducoes();
atualizarBotoesConfig();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bolha Kids - Aprender Brincando</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); touch-action: manipulation; }

.tela { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
.tela.ativa { display: flex; }

#telaInicial { background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%); padding: 20px; text-align: center; }
#telaInicial .bolhas-fundo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
.bolha-decorativa { position: absolute; border-radius: 50%; opacity: 0.3; animation: flutuar 8s ease-in-out infinite; }
@keyframes flutuar { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.1); } }
#telaInicial .conteudo { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.logo-titulo { font-size: 64px; font-weight: 900; color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.3); letter-spacing: 2px; line-height: 1; margin-bottom: 10px; animation: pulsarLogo 3s ease-in-out infinite; }
@keyframes pulsarLogo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.logo-sub { font-size: 20px; color: rgba(255,255,255,0.9); font-weight: 400; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 40px; }
.botao-iniciar { font-size: 32px; font-weight: 800; padding: 25px 70px; background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); color: white; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #cc7a1e, 0 15px 30px rgba(0,0,0,0.3); transition: all 0.15s; font-family: inherit; letter-spacing: 3px; text-transform: uppercase; touch-action: manipulation; }
.botao-iniciar:active { transform: translateY(6px); box-shadow: 0 4px 0 #cc7a1e, 0 8px 15px rgba(0,0,0,0.3); }
.botao-config-inicial { position: absolute; top: 20px; right: 20px; width: 60px; height: 60px; font-size: 30px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); touch-action: manipulation; }
.botao-config-inicial:active { transform: scale(0.9); }

#telaJogo { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
#canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
.controles-jogo { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
.botao-jogo { width: 50px; height: 50px; font-size: 22px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); color: white; touch-action: manipulation; font-family: inherit; }
.botao-jogo:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }
#ui { position: fixed; top: 15px; left: 15px; color: rgba(255,255,255,0.6); font-size: 14px; pointer-events: none; font-weight: 300; letter-spacing: 1px; }
#estouradas { font-size: 38px; font-weight: 200; color: rgba(255,255,255,0.9); display: block; margin-bottom: 3px; transition: transform 0.2s ease; }
#estouradas.pulso { transform: scale(1.15); }
#recorde { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }
#fase { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.9); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; text-align: center; font-weight: 300; z-index: 5; }
#fase .titulo { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 3px; }
#fase .numero { font-size: 28px; font-weight: 300; display: block; margin: 2px 0; }
#progresso { width: 140px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 6px auto 0; overflow: hidden; }
#barra { height: 100%; width: 0%; background: linear-gradient(90deg, #ffdc3c, #ff465a); transition: width 0.4s ease; border-radius: 2px; }
#instrucao { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; animation: fadeInOut 3s ease-in-out infinite; text-align: center; padding: 0 20px; max-width: 90vw; }
@keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
#combo { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); color: rgba(255,255,255,0.95); font-size: 70px; font-weight: 900; pointer-events: none; transition: transform 0.4s, opacity 0.6s; opacity: 0; text-shadow: 0 0 40px rgba(255,220,60,0.8); text-align: center; z-index: 8; }
#combo.mostrar { transform: translate(-50%,-50%) scale(1); opacity: 1; }
#overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 20; text-align: center; padding: 20px; }
#overlay.mostrar { opacity: 1; pointer-events: all; }
#overlay h1 { font-size: 56px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 40px rgba(255,220,60,0.8); letter-spacing: 3px; color: #ffdc3c; }
#overlay p { font-size: 18px; color: rgba(255,255,255,0.8); letter-spacing: 2px; font-weight: 400; }
#overlay button { margin-top: 40px; padding: 18px 50px; background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); border: none; color: white; font-size: 18px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; border-radius: 50px; transition: all 0.15s; font-family: inherit; box-shadow: 0 6px 0 #cc7a1e; touch-action: manipulation; }
#overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc7a1e; }

#telaConfig { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 20px; overflow-y: auto; justify-content: flex-start; padding-top: 80px; }
.config-titulo { font-size: 32px; font-weight: 800; color: white; margin-bottom: 30px; letter-spacing: 2px; text-align: center; }
.config-item { width: 100%; max-width: 500px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: white; font-size: 16px; font-weight: 500; letter-spacing: 1px; }
.config-item .rotulo { display: flex; align-items: center; gap: 10px; }
.config-item .rotulo .icone { font-size: 24px; }
.opcoes { display: flex; gap: 6px; }
.opcao { padding: 8px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.7); transition: all 0.2s; font-family: inherit; font-weight: 500; min-width: 50px; text-align: center; touch-action: manipulation; }
.opcao:active { transform: scale(0.95); }
.opcao.ativa { background: linear-gradient(135deg, #ffdc3c 0%, #ff9a3c 100%); color: white; border-color: transparent; font-weight: 700; box-shadow: 0 3px 10px rgba(255,220,60,0.4); }
.botao-voltar { position: fixed; top: 20px; left: 20px; width: 60px; height: 60px; font-size: 28px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center; color: white; backdrop-filter: blur(10px); touch-action: manipulation; }
.botao-voltar:active { transform: scale(0.9); }

@media (max-width: 500px) {
  .logo-titulo { font-size: 48px; }
  .logo-sub { font-size: 14px; letter-spacing: 3px; }
  .botao-iniciar { font-size: 24px; padding: 20px 50px; }
  #overlay h1 { font-size: 40px; }
  .config-item { flex-direction: column; align-items: flex-start; gap: 10px; }
  .opcoes { width: 100%; justify-content: space-between; }
  .opcao { flex: 1; padding: 10px 6px; font-size: 13px; }
  .config-titulo { font-size: 24px; }
  #fase .numero { font-size: 22px; }
  #estouradas { font-size: 30px; }
}
</style>
</head>
<body>

<div class="tela ativa" id="telaInicial">
  <div class="bolhas-fundo" id="bolhasFundo"></div>
  <button class="botao-config-inicial" id="btnAbrirConfig" title="Configurações">⚙️</button>
  <div class="conteudo">
    <div class="logo-titulo">Bolha Kids</div>
    <div class="logo-sub">Aprender Brincando</div>
    <button class="botao-iniciar" id="btnIniciar">▶ Iniciar</button>
  </div>
</div>

<div class="tela" id="telaJogo">
  <canvas id="canvas"></canvas>
  <div class="controles-jogo">
    <button class="botao-jogo" id="btnHome" title="Início">🏠</button>
    <button class="botao-jogo" id="btnConfig" title="Configurações">⚙️</button>
  </div>
  <div id="ui">
    <span id="estouradas">0</span>
    bolhas
    <div id="recorde">Recorde: <span id="recordeValor">0</span></div>
  </div>
  <div id="fase">
    <div class="titulo">FASE</div>
    <span class="numero" id="numeroFase">1</span>
    <div id="progresso"><div id="barra"></div></div>
  </div>
  <div id="combo"></div>
  <div id="overlay">
    <h1 id="overlayTitulo">FASE COMPLETA!</h1>
    <p id="overlayTexto">Próxima fase em breve</p>
    <button id="overlayBotao">Continuar</button>
  </div>
  <div id="instrucao">Junte 3 bolhas iguais!</div>
</div>

<div class="tela" id="telaConfig">
  <button class="botao-voltar" id="btnVoltar" title="Voltar">←</button>
  <div class="config-titulo">⚙️ Configurações</div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🔊</span> Som</div>
    <div class="opcoes" id="opcoesSom">
      <button class="opcao" data-valor="on">Ligado</button>
      <button class="opcao" data-valor="off">Desligado</button>
    </div>
  </div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🗣️</span> Voz</div>
    <div class="opcoes" id="opcoesVoz">
      <button class="opcao" data-valor="on">Ligada</button>
      <button class="opcao" data-valor="off">Desligada</button>
    </div>
  </div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🌍</span> Idioma</div>
    <div class="opcoes" id="opcoesIdioma">
      <button class="opcao" data-valor="pt">🇧🇷 PT</button>
      <button class="opcao" data-valor="en">🇺🇸 EN</button>
    </div>
  </div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🎓</span> Ensinar</div>
    <div class="opcoes" id="opcoesModoEdu">
      <button class="opcao" data-valor="off">Nada</button>
      <button class="opcao" data-valor="numeros">Números</button>
      <button class="opcao" data-valor="cores">Cores</button>
      <button class="opcao" data-valor="ambos">Ambos</button>
    </div>
  </div>
  <div class="config-item">
    <div class="rotulo"><span class="icone">🧘</span> Modo</div>
    <div class="opcoes" id="opcoesModo">
      <button class="opcao" data-valor="normal">Normal</button>
      <button class="opcao" data-valor="zen">Zen</button>
    </div>
  </div>
</div>

<script>
const telaInicial = document.getElementById('telaInicial');
const telaJogo = document.getElementById('telaJogo');
const telaConfig = document.getElementById('telaConfig');
const btnIniciar = document.getElementById('btnIniciar');
const btnAbrirConfig = document.getElementById('btnAbrirConfig');
const btnConfig = document.getElementById('btnConfig');
const btnHome = document.getElementById('btnHome');
const btnVoltar = document.getElementById('btnVoltar');

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const estouradasEl = document.getElementById('estouradas');
const recordeEl = document.getElementById('recordeValor');
const instrucaoEl = document.getElementById('instrucao');
const comboEl = document.getElementById('combo');
const numeroFaseEl = document.getElementById('numeroFase');
const barraEl = document.getElementById('barra');
const overlayEl = document.getElementById('overlay');
const overlayTituloEl = document.getElementById('overlayTitulo');
const overlayTextoEl = document.getElementById('overlayTexto');
const overlayBotaoEl = document.getElementById('overlayBotao');

let telaAtual = 'inicial';
let largura = 0, altura = 0;
let bolhas = [];
let particulas = [];
let estouradas = 0;
let modoZen = false;
let bolhasSelecionadas = [];
let fase = 1;
let combosFeitos = 0;
let combosNecessarios = 3;
let jogoPausado = false;
let velocidadeMultiplicador = 1.0;

let somLigado = true;
let audioContext = null;
let vozLigada = true;
let idioma = 'pt';
let modoEducativo = 'numeros';

const textos = {
  numeros: {
    pt: { 1: 'um', 2: 'dois', 3: 'três', 4: 'quatro', 5: 'cinco' },
    en: { 1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five' }
  },
  cores: {
    pt: { 1: 'vermelho', 2: 'azul', 3: 'verde', 4: 'amarelo', 5: 'roxo' },
    en: { 1: 'red', 2: 'blue', 3: 'green', 4: 'yellow', 5: 'purple' }
  }
};

const tipos = [
  { cor: 'rgba(255,70,90,0.9)', numero: 1, nome: 'vermelho-1', som: 400 },
  { cor: 'rgba(60,130,255,0.9)', numero: 2, nome: 'azul-2', som: 500 },
  { cor: 'rgba(70,220,120,0.9)', numero: 3, nome: 'verde-3', som: 600 },
  { cor: 'rgba(255,220,60,0.9)', numero: 4, nome: 'amarelo-4', som: 700 },
  { cor: 'rgba(180,100,255,0.9)', numero: 5, nome: 'roxo-5', som: 800 },
];

let recorde = parseInt(localStorage.getItem('recordeBolhas') || '0');
recordeEl.textContent = recorde;

function criarBolhasDecorativas() {
  const container = document.getElementById('bolhasFundo');
  container.innerHTML = '';
  const cores = ['rgba(255,220,60,0.5)','rgba(255,70,90,0.5)','rgba(60,130,255,0.5)','rgba(70,220,120,0.5)','rgba(180,100,255,0.5)'];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bolha-decorativa';
    const tamanho = 40 + Math.random() * 120;
    b.style.width = tamanho + 'px';
    b.style.height = tamanho + 'px';
    b.style.background = cores[Math.floor(Math.random() * cores.length)];
    b.style.left = Math.random() * 100 + '%';
    b.style.top = Math.random() * 100 + '%';
    b.style.animationDelay = Math.random() * 8 + 's';
    b.style.animationDuration = (6 + Math.random() * 6) + 's';
    container.appendChild(b);
  }
}
criarBolhasDecorativas();

function irParaTela(nomeTela) {
  telaAtual = nomeTela;
  telaInicial.classList.remove('ativa');
  telaJogo.classList.remove('ativa');
  telaConfig.classList.remove('ativa');

  if (nomeTela === 'inicial') {
    telaInicial.classList.add('ativa');
  } else if (nomeTela === 'jogo') {
    telaJogo.classList.add('ativa');
    redimensionar();
    reiniciarJogo();
  } else if (nomeTela === 'config') {
    telaConfig.classList.add('ativa');
    atualizarBotoesConfig();
  }
}

function reiniciarJogo() {
  fase = 1;
  combosFeitos = 0;
  combosNecessarios = 3;
  velocidadeMultiplicador = 1.0;
  estouradas = 0;
  bolhas = [];
  particulas = [];
  bolhasSelecionadas = [];
  jogoPausado = false;
  numeroFaseEl.textContent = 1;
  atualizarContador();
  atualizarBarraProgresso();
  overlayEl.classList.remove('mostrar');
}

btnIniciar.addEventListener('click', () => { initAudio(); irParaTela('jogo'); });
btnAbrirConfig.addEventListener('click', () => irParaTela('config'));
btnConfig.addEventListener('click', () => irParaTela('config'));
btnHome.addEventListener('click', () => irParaTela('inicial'));
btnVoltar.addEventListener('click', () => irParaTela('inicial'));

function initAudio() {
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') audioContext.resume();
}

function tocarPop(frequenciaBase = 600) {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const ganho = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(frequenciaBase, agora);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 2.5, agora + 0.08);
  osc.frequency.exponentialRampToValueAtTime(frequenciaBase * 0.5, agora + 0.15);
  ganho.gain.setValueAtTime(0.0001, agora);
  ganho.gain.exponentialRampToValueAtTime(0.15, agora + 0.01);
  ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.15);
  osc.connect(ganho); ganho.connect(audioContext.destination);
  osc.start(agora); osc.stop(agora + 0.15);
}

function tocarCombo() {
  if (!somLigado || !audioContext) return;
  const agora = audioContext.currentTime;
  [880, 1320].forEach((freq, i) => {
    const osc = audioContext.createOscillator();
    const ganho = audioContext.createGain();
    const inicio = agora + i * 0.08;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, inicio);
    ganho.gain.setValueAtTime(0.0001, inicio);
    ganho.gain.exponentialRampToValueAtTime(0.12, inicio + 0.01);
    ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.15);
    osc.connect(ganho); ganho.connect(audioContext.destination);
    osc.start(inicio); osc.stop(inicio + 0.15);
  });
}

function falar(texto) {
  if (!vozLigada) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = idioma === 'pt' ? 'pt-BR' : 'en-US';
  u.rate = 0.9; u.pitch = 1.1; u.volume = 0.85;
  window.speechSynthesis.speak(u);
}

function falarCombo(numero) {
  if (!vozLigada) return;
  let texto = '';
  if (modoEducativo === 'off' || modoEducativo === 'numeros') {
    texto = textos.numeros[idioma][numero];
  } else if (modoEducativo === 'cores') {
    texto = textos.cores[idioma][numero];
  } else if (modoEducativo === 'ambos') {
    texto = textos.numeros[idioma][numero] + ', ' + textos.cores[idioma][numero];
  }
  if (texto) setTimeout(() => falar(texto), 250);
}

function atualizarBotoesConfig() {
  document.querySelectorAll('#opcoesSom .opcao').forEach(b => b.classList.toggle('ativa', b.dataset.valor === (somLigado ? 'on' : 'off')));
  document.querySelectorAll('#opcoesVoz .opcao').forEach(b => b.classList.toggle('ativa', b.dataset.valor === (vozLigada ? 'on' : 'off')));
  document.querySelectorAll('#opcoesIdioma .opcao').forEach(b => b.classList.toggle('ativa', b.dataset.valor === idioma));
  document.querySelectorAll('#opcoesModoEdu .opcao').forEach(b => b.classList.toggle('ativa', b.dataset.valor === modoEducativo));
  document.querySelectorAll('#opcoesModo .opcao').forEach(b => b.classList.toggle('ativa', b.dataset.valor === (modoZen ? 'zen' : 'normal')));
}

document.getElementById('opcoesSom').addEventListener('click', (e) => {
  if (!e.target.classList.contains('opcao')) return;
  somLigado = e.target.dataset.valor === 'on';
  atualizarBotoesConfig();
  if (somLigado) { initAudio(); tocarPop(600); }
});

document.getElementById('opcoesVoz').addEventListener('click', (e) => {
  if (!e.target.classList.contains('opcao')) return;
  vozLigada = e.target.dataset.valor === 'on';
  atualizarBotoesConfig();
  if (vozLigada) setTimeout(() => falar(idioma === 'pt' ? 'Voz ligada' : 'Voice on'), 100);
});

document.getElementById('opcoesIdioma').addEventListener('click', (e) => {
  if (!e.target.classList.contains('opcao')) return;
  idioma = e.target.dataset.valor;
  atualizarBotoesConfig();
  if (vozLigada) setTimeout(() => falar(idioma === 'pt' ? 'Português' : 'English'), 100);
});

document.getElementById('opcoesModoEdu').addEventListener('click', (e) => {
  if (!e.target.classList.contains('opcao')) return;
  modoEducativo = e.target.dataset.valor;
  atualizarBotoesConfig();
  if (vozLigada && modoEducativo !== 'off') {
    const ex = { 'numeros': idioma === 'pt' ? 'dois' : 'two', 'cores': idioma === 'pt' ? 'azul' : 'blue', 'ambos': idioma === 'pt' ? 'dois, azul' : 'two, blue' };
    setTimeout(() => falar(ex[modoEducativo]), 100);
  }
});

document.getElementById('opcoesModo').addEventListener('click', (e) => {
  if (!e.target.classList.contains('opcao')) return;
  modoZen = e.target.dataset.valor === 'zen';
  atualizarBotoesConfig();
});

function redimensionar() {
  if (!canvas) return;
  largura = canvas.width = window.innerWidth;
  altura = canvas.height = window.innerHeight;
}
window.addEventListener('resize', redimensionar);

function criarBolha() {
  const raio = 35 + Math.random() * 25;
  const tipo = tipos[Math.floor(Math.random() * tipos.length)];
  return {
    id: Math.random().toString(36).substring(2, 9),
    x: Math.random() * (largura - raio * 2) + raio,
    y: altura + raio,
    raio: raio,
    cor: tipo.cor,
    numero: tipo.numero,
    tipoNome: tipo.nome,
    som: tipo.som,
    velocidade: (0.4 + Math.random() * 0.5) * velocidadeMultiplicador,
    oscilacao: Math.random() * Math.PI * 2,
    oscilacaoVelocidade: 0.01 + Math.random() * 0.02,
    selecionada: false,
    escala: 1.0
  };
}

function criarParticulas(x, y, cor, qtd = 15) {
  for (let i = 0; i < qtd; i++) {
    const ang = (Math.PI * 2 * i) / qtd + Math.random() * 0.5;
    const vel = 2 + Math.random() * 5;
    particulas.push({ x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, raio: 2 + Math.random() * 5, cor, vida: 1.0, decaimento: 0.012 + Math.random() * 0.015 });
  }
}

function mostrarCombo(texto, cor) {
  comboEl.textContent = texto;
  comboEl.style.color = cor || 'rgba(255,255,255,0.95)';
  comboEl.classList.add('mostrar');
  setTimeout(() => comboEl.classList.remove('mostrar'), 700);
}

function atualizarBarraProgresso() {
  barraEl.style.width = ((combosFeitos / combosNecessarios) * 100) + '%';
}

function desenhar() {
  if (telaAtual !== 'jogo') { requestAnimationFrame(desenhar); return; }

  ctx.fillStyle = 'rgba(15,20,40,0.35)';
  ctx.fillRect(0, 0, largura, altura);

  if (!jogoPausado) {
    for (let i = bolhas.length - 1; i >= 0; i--) {
      const b = bolhas[i];
      b.y -= b.velocidade;
      b.oscilacao += b.oscilacaoVelocidade;
      b.x += Math.sin(b.oscilacao) * 0.5;

      const escalaAlvo = b.selecionada ? 1.15 : 1.0;
      b.escala += (escalaAlvo - b.escala) * 0.15;

      if (b.selecionada) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.raio * b.escala + 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      const grad = ctx.createRadialGradient(b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.1, b.x, b.y, b.raio * b.escala);
      grad.addColorStop(0, 'rgba(255,255,255,0.7)');
      grad.addColorStop(0.5, b.cor);
      grad.addColorStop(1, b.cor.replace('0.9', '0.5'));

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.raio * b.escala, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x - b.raio * 0.3, b.y - b.raio * 0.3, b.raio * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();

      ctx.save();
      ctx.font = `bold ${b.raio * 0.9}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(b.numero, b.x + 2, b.y + 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillText(b.numero, b.x, b.y);
      ctx.restore();

      if (b.y + b.raio < 0) {
        const idx = bolhasSelecionadas.indexOf(b);
        if (idx > -1) bolhasSelecionadas.splice(idx, 1);
        bolhas.splice(i, 1);
      }
    }
  }

  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vida -= p.decaimento;
    if (p.vida <= 0) { particulas.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.raio * p.vida, 0, Math.PI * 2);
    ctx.fillStyle = p.cor.replace('0.9', p.vida.toFixed(2));
    ctx.fill();
  }

  requestAnimationFrame(desenhar);
}
desenhar();

function gerarBolhas() {
  if (telaAtual !== 'jogo') { setTimeout(gerarBolhas, 500); return; }
  if (jogoPausado) { setTimeout(gerarBolhas, 500); return; }
  const max = modoZen ? 8 : 10;
  if (bolhas.length < max) bolhas.push(criarBolha());
  setTimeout(gerarBolhas, modoZen ? 1200 : 800);
}
gerarBolhas();

function limparSelecionadas() {
  bolhasSelecionadas.forEach(b => b.selecionada = false);
  bolhasSelecionadas = [];
}

function atualizarContador() {
  estouradasEl.textContent = estouradas;
  estouradasEl.classList.add('pulso');
  setTimeout(() => estouradasEl.classList.remove('pulso'), 200);
  if (estouradas > recorde) {
    recorde = estouradas;
    localStorage.setItem('recordeBolhas', recorde);
    recordeEl.textContent = recorde;
  }
}

function passarDeFase() {
  jogoPausado = true;
  overlayTituloEl.textContent = 'FASE ' + fase + ' COMPLETA!';
  overlayTextoEl.textContent = 'Próxima: ' + (combosNecessarios + 2) + ' combos';
  overlayEl.classList.add('mostrar');
}

function proximaFase() {
  fase++;
  combosFeitos = 0;
  combosNecessarios += 2;
  velocidadeMultiplicador += 0.2;
  numeroFaseEl.textContent = fase;
  atualizarBarraProgresso();
  bolhas = []; particulas = []; bolhasSelecionadas = [];
  jogoPausado = false;
  overlayEl.classList.remove('mostrar');
}

function clicar(x, y) {
  if (jogoPausado) return;
  initAudio();

  for (let i = bolhas.length - 1; i >= 0; i--) {
    const b = bolhas[i];
    if (Math.hypot(x - b.x, y - b.y) < b.raio) {
      if (modoZen) {
        tocarPop(b.som);
        criarParticulas(b.x, b.y, b.cor);
        bolhas.splice(i, 1);
        estouradas++;
        atualizarContador();
        return;
      }

      if (b.selecionada) {
        b.selecionada = false;
        const idx = bolhasSelecionadas.indexOf(b);
        if (idx > -1) bolhasSelecionadas.splice(idx, 1);
        return;
      }

      if (bolhasSelecionadas.length === 0) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);
        return;
      }

      const primeira = bolhasSelecionadas[0];

      if (b.tipoNome === primeira.tipoNome) {
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);

        if (bolhasSelecionadas.length === 3) {
          estouradas += 3;
          combosFeitos++;
          atualizarContador();
          atualizarBarraProgresso();
          mostrarCombo('COMBO! +3', primeira.cor);
          tocarCombo();
          falarCombo(primeira.numero);

          bolhasSelecionadas.forEach(sel => criarParticulas(sel.x, sel.y, sel.cor, 20));
          bolhasSelecionadas.forEach(sel => {
            const idx = bolhas.indexOf(sel);
            if (idx > -1) bolhas.splice(idx, 1);
          });
          bolhasSelecionadas = [];

          if (combosFeitos >= combosNecessarios) setTimeout(passarDeFase, 500);
        }
      } else {
        limparSelecionadas();
        b.selecionada = true;
        bolhasSelecionadas.push(b);
        tocarPop(b.som * 0.8);
      }
      return;
    }
  }
  limparSelecionadas();
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clicar(e.clientX, e.clientY);
});

overlayBotaoEl.addEventListener('click', proximaFase);
</script>
